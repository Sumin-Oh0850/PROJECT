<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제주 레저 활동 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
 body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
 header{padding:12px 16px;background:#1f3a5f;color:#fff}
 header h1{margin:0;font-size:18px} header p{margin:4px 0 0;font-size:13px;opacity:.85}
 #map{height:calc(100vh - 64px)}
 .legend{background:#fff;padding:8px 10px;border-radius:6px;font-size:13px;line-height:1.7}
 .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
</style></head><body>
<header><h1>제주 레저 활동 지도</h1><p>초록=가능 · 주황=주의 · 빨강=불가  |  참고용 판정이며 현장 안내를 우선하세요</p></header>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const data = [{"site": "중문색달해변", "activity": "서핑", "status": "가능", "reasons": ["기준 내 양호"], "lat": 33.2447, "lng": 126.412, "wind": 4.2, "gust": 6.0, "wave": 1.2, "link": "https://www.openstreetmap.org/?mlat=33.2447&mlon=126.412#map=15/33.2447/126.412"}, {"site": "이호테우해변", "activity": "서핑", "status": "주의", "reasons": ["풍속 7m/s 이상, 파도가 거칠어짐", "돌풍 10m/s 이상", "파고 2m 이상 (중급 이상 권장)"], "lat": 33.4977, "lng": 126.453, "wind": 8.5, "gust": 12.5, "wave": 2.4, "link": "https://www.openstreetmap.org/?mlat=33.4977&mlon=126.453#map=15/33.4977/126.453"}, {"site": "곽지해변", "activity": "서핑", "status": "가능", "reasons": ["기준 내 양호"], "lat": 33.4505, "lng": 126.3048, "wind": 6.0, "gust": 8.5, "wave": 1.5, "link": "https://www.openstreetmap.org/?mlat=33.4505&mlon=126.3048#map=15/33.4505/126.3048"}, {"site": "월정리해변", "activity": "서핑", "status": "가능", "reasons": ["기준 내 양호"], "lat": 33.5563, "lng": 126.7958, "wind": 3.0, "gust": 4.5, "wave": 0.8, "link": "https://www.openstreetmap.org/?mlat=33.5563&mlon=126.7958#map=15/33.5563/126.7958"}, {"site": "하도해변", "activity": "서핑", "status": "가능", "reasons": ["기준 내 양호"], "lat": 33.51, "lng": 126.893, "wind": 2.5, "gust": 3.8, "wave": 0.4, "link": "https://www.openstreetmap.org/?mlat=33.51&mlon=126.893#map=15/33.51/126.893"}, {"site": "신양섭지코지해변", "activity": "윈드서핑", "status": "가능", "reasons": ["기준 내 양호"], "lat": 33.436, "lng": 126.92, "wind": 7.5, "gust": 10.0, "wave": 1.0, "link": "https://www.openstreetmap.org/?mlat=33.436&mlon=126.92#map=15/33.436/126.92"}, {"site": "김녕해변", "activity": "윈드서핑", "status": "불가", "reasons": ["풍속 14m/s 이상", "돌풍 17m/s 이상"], "lat": 33.558, "lng": 126.759, "wind": 14.5, "gust": 18.0, "wave": 2.8, "link": "https://www.openstreetmap.org/?mlat=33.558&mlon=126.759#map=15/33.558/126.759"}, {"site": "금오름 이륙장", "activity": "패러글라이딩", "status": "가능", "reasons": ["기준 내 양호"], "lat": 33.3545, "lng": 126.306, "wind": 3.5, "gust": 5.0, "wave": null, "link": "https://www.openstreetmap.org/?mlat=33.3545&mlon=126.306#map=15/33.3545/126.306"}];
const colors = {"가능": "#1baf7a", "주의": "#eda100", "불가": "#e34948"};
const map = L.map('map').setView([33.38, 126.55], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom: 18, attribution: '&copy; OpenStreetMap'}).addTo(map);
data.forEach(d => {
  L.circleMarker([d.lat, d.lng], {radius: 10, color: '#fff', weight: 2,
     fillColor: colors[d.status], fillOpacity: 0.95}).addTo(map)
   .bindPopup(`<b>${d.site}</b> (${d.activity})<br>판정: <b>${d.status}</b><br>
     ${d.reasons.join('<br>')}<br>풍속 ${d.wind} m/s · 돌풍 ${d.gust} m/s
     ${d.wave != null ? ' · 파고 ' + d.wave + ' m' : ''}<br>
     <a href="${d.link}" target="_blank">OpenStreetMap에서 크게 보기</a>`);
});
const lg = L.control({position: 'bottomright'});
lg.onAdd = () => { const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = Object.entries(colors).map(([k, v]) =>
    `<span class="dot" style="background:${v}"></span>${k}`).join('<br>'); return div; };
lg.addTo(map);
</script></body></html>
