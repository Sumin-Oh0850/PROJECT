<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <title>바당타기</title>

    <!-- 링크를 공유할 때(카카오톡·슬랙 등) 보이는 미리보기 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="바당타기 · 제주 서핑가이드" />
    <meta property="og:description" content="제주 해변의 바람·파도를 보고 알려 드려요." />
    <meta property="og:image" content="https://jejubadatagi.vercel.app/images/og.png" />
    <meta property="og:url" content="https://jejubadatagi.vercel.app/" />

    <!-- 브라우저 탭 아이콘 (svg 를 못 쓰는 브라우저는 png) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png" />

    <!-- iPhone 홈 화면에 추가할 때 쓰는 아이콘 -->
    <link rel="apple-touch-icon" href="/images/icon-180.png" />

    <!-- 모바일 홈 화면에 앱처럼 추가 (이름·아이콘·색 설정) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#3a6c94" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
